# Static verification for the backend and the console, plus the infrastructure
# security contract. Tests are deliberately not run here — they are executed
# locally, scoped to the change.
#
# There is no deployment job. Publishing the console needs Cloudflare
# credentials, which are not available to forks and are not published with this
# repository; see web/README.md for the manual release path.
#
# Tool versions are pinned (python 3.13, uv 0.11.28, node 24.18.0; pnpm comes
# from web/package.json "packageManager", which is already sha512-pinned), and
# every action is pinned to a commit SHA. scripts/check-infrastructure-security.sh
# enforces both.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Mirrors infra:security-contract
  infra:
    name: infrastructure security contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/check-infrastructure-security.sh

  # Mirrors server:verify — static verification and package build, no tests.
  server:
    name: server verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: server/.python-version

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - run: uv sync --frozen --all-groups
      - run: make verify
      - run: make build

  # Mirrors web:check — lint, format, typecheck, Worker build. No tests.
  web:
    name: web check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: /api
      API_PROXY_TARGET: https://api.example.test
      NEXT_PUBLIC_SITE_URL: https://rpc.example.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"

      # Must run after setup-node so the shims attach to the Node it installed.
      # `corepack enable` leaves the sha512-pinned "packageManager" field in
      # web/package.json authoritative for which pnpm version is used.
      - name: Enable corepack
        run: corepack enable

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build:worker
