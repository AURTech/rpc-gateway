# Built-in fast hooks (offline, zero-setup, Rust-native)
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "check-added-large-files", args = ["--maxkb=512"] },
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
]

# Biome: auto-fix + format on staged files
[[repos]]
repo = "local"
hooks = [
  {
    id = "biome-check",
    name = "biome check --write",
    language = "system",
    entry = "pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true",
    types_or = ["javascript", "jsx", "ts", "tsx", "json", "css"],
  },
]
