# Supply-chain hardening: refuse versions published less than 7 days ago, so a
# compromised release that gets caught and unpublished within hours never lands.
minimumReleaseAge: 10080
# Pin build-time transitive deps to advisory-patched versions. All three are only
# exercised at build time (not on the runtime request path); overriding just keeps
# `pnpm audit --prod` clean. picomatch is scoped to the 4.0.x line so the separate
# picomatch@2 subtree used by other tools is left untouched.
overrides:
  'picomatch@>=4.0.0 <4.0.4': '>=4.0.4'
  postcss: '>=8.5.10'
  '@babel/core': '>=7.29.1 <8'
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  msw: true
  sharp: false
  workerd: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
